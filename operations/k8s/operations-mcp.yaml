apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-mcp
  namespace: nano-bank
  labels: { app: operations-mcp }
spec:
  replicas: 1
  selector: { matchLabels: { app: operations-mcp } }
  template:
    metadata: { labels: { app: operations-mcp } }
    spec:
      containers:
      - name: mcp
        image: nano-operations-mcp:dev
        imagePullPolicy: Never
        ports: [ { containerPort: 8092 } ]
        env:
        - { name: NANO_BANK_API,        value: http://bank-api:8081 }
        # Shared service-plane credential with the bank — sourced from a Secret,
        # never a plaintext manifest value. Minted by coo/k8s/deploy.sh into
        # nano-agent-secrets (must equal bank-api's service_client_secret).
        - name: SERVICE_CLIENT_SECRET
          valueFrom:
            secretKeyRef: { name: nano-agent-secrets, key: SERVICE_CLIENT_SECRET }
        - { name: MCP_PORT,             value: "8092" }
        # nano-bank-crm is not (yet) deployed inside this cluster — it runs as a
        # separate host-level Next.js process. host.docker.internal reaches the
        # kind node's host from inside the cluster; adjust if nano-bank-crm ever
        # gets its own in-cluster deployment (then point this at its Service DNS
        # name, the same way NANO_BANK_API above points at bank-api).
        - { name: CRM_BASE_URL,         value: http://host.docker.internal:3000 }
        - { name: CRM_TENANT_SLUG,      value: acme }
        # Must match nano-bank-crm's CO_PROVISIONING_TOKEN — minted by
        # coo/k8s/deploy.sh into nano-agent-secrets, same as SERVICE_CLIENT_SECRET.
        - name: CRM_PROVISIONING_TOKEN
          valueFrom:
            secretKeyRef: { name: nano-agent-secrets, key: CRM_PROVISIONING_TOKEN }
---
apiVersion: v1
kind: Service
metadata:
  name: operations-mcp
  namespace: nano-bank
spec:
  selector: { app: operations-mcp }
  ports: [ { port: 8092, targetPort: 8092 } ]
