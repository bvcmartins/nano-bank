# Coder service — LOCAL sandbox mode (no GitHub), sandbox IN-CLUSTER + CONTAINED.
#
# Containment posture (the coder runs MODEL-AUTHORED code, so treat it as hostile):
#   * FS: no host mount; the sandbox is a bare repo on a PVC at /sandbox, seeded by
#     an initContainer from the image's coder/sandbox-seed/. The model can read/write
#     ONLY the sandbox + a /tmp scratch dir. Your other repos/files aren't present.
#   * Secrets: only the OLLAMA_API_KEY is provided (not the whole nano-agent-secrets),
#     and it is mounted as a FILE (not an env var) so it is absent from the process
#     environment — a model-authored subprocess cannot read it back out of
#     /proc/1/environ. sandbox_env() still scrubs any *_KEY/_TOKEN env for defence in
#     depth; the file mount is what closes the /proc route the containment tests probe.
#   * Pod: non-root, read-only rootfs (only /tmp writable), all caps dropped, no
#     privilege escalation, seccomp RuntimeDefault, no k8s API token.
#   * Network: the coder needs NO host access (sandbox is in-cluster). Deny the pod
#     from reaching your host + LAN with coder/k8s/egress-firewall.sh (kindnet does
#     not enforce NetworkPolicy). Internet egress (ollama.com) stays open — harmless,
#     since the pod can't read anything sensitive to exfiltrate.
#
# Review / merge a delegated change (host-initiated; no inbound pod->host):
#   kubectl -n nano-bank exec deploy/coder -- git -C /sandbox log --oneline --all
#   kubectl -n nano-bank exec deploy/coder -- git -C /sandbox diff main..<branch>
#   kubectl -n nano-bank exec deploy/coder -- git -C /sandbox merge --ff-only <branch>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coder-sandbox
  namespace: nano-bank
spec:
  accessModes: [ ReadWriteOnce ]
  resources:
    requests:
      storage: 200Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder
  namespace: nano-bank
  labels: { app: coder }
spec:
  replicas: 1
  strategy: { type: Recreate }        # RWO PVC — one pod at a time
  selector: { matchLabels: { app: coder } }
  template:
    metadata: { labels: { app: coder } }
    spec:
      automountServiceAccountToken: false      # no k8s API token in the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000                          # so uid 1000 can write the PVC
        seccompProfile: { type: RuntimeDefault }
      initContainers:
      - name: seed-sandbox
        image: nano-coder:dev
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ "ALL" ] }
        env:
        - { name: HOME, value: /tmp }
        command: ["sh", "-c"]
        args:
          - |
            set -e
            # The PVC mount is root-owned (the provisioner made it); we run as uid
            # 1000, so let git operate on it. Global config lives in HOME=/tmp
            # (a shared emptyDir), so the main container's git sees it too.
            git config --global --add safe.directory '*'
            # Guard on a real commit (refs/heads/main), NOT just HEAD — `git init`
            # creates HEAD immediately, so a partial/failed prior seed must re-seed.
            if git -C /sandbox rev-parse --verify -q refs/heads/main >/dev/null 2>&1; then
              echo "sandbox already initialised; leaving as-is."
            else
              echo "seeding bare sandbox repo at /sandbox ..."
              git init --bare -b main /sandbox
              tmp=$(mktemp -d)
              cp -r /app/coder/sandbox-seed/. "$tmp"/
              rm -f "$tmp"/provision-sandbox.sh
              find "$tmp" \( -name __pycache__ -o -name '*.pyc' \) -exec rm -rf {} + 2>/dev/null || true
              cd "$tmp"
              git init -q -b main
              git add -A
              git -c user.email=coder@nano.bank -c user.name="nano-bank coder" \
                  commit -qm "baseline: helper_service with two intentional gaps"
              git tag baseline
              git remote add origin /sandbox
              git push -q -u origin main
              git push -q origin baseline
              echo "seeded."
            fi
        volumeMounts:
        - { name: sandbox, mountPath: /sandbox }
        - { name: work, mountPath: /tmp }
      containers:
      - name: coder
        image: nano-coder:dev
        imagePullPolicy: Never
        ports: [ { containerPort: 8096 } ]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true         # only the /tmp + /sandbox mounts are writable
          capabilities: { drop: [ "ALL" ] }
        env:
        # Least privilege: ONLY the ollama key (not the whole nano-agent-secrets;
        # SERVICE_CLIENT_SECRET is deliberately not present in this pod). The key is
        # supplied as a MOUNTED FILE (see the ollama-key volume) and read once at
        # startup — it never enters the process environment, so it can't be recovered
        # from /proc/1/environ by model-authored code. Only the *path* is an env var.
        - { name: OLLAMA_API_KEY_PATH,  value: /var/run/secrets/ollama/api-key }
        - { name: OLLAMA_BASE_URL,      value: https://ollama.com/v1 }
        - { name: CODER_MODEL,          value: kimi-k2.6 }
        - { name: CODER_MODEL_FALLBACK, value: kimi-k2.6 }
        - { name: SANDBOX_MODE,         value: local }
        - { name: SANDBOX_REPO,         value: cto-sandbox }
        - { name: SANDBOX_CLONE_URL,    value: "file:///sandbox" }
        - { name: HOME,                 value: /tmp }
        - { name: CODER_WORKSPACE,      value: /tmp/coder-home }       # import-time default workspace
        - { name: CODER_WORKSPACE_ROOT, value: /tmp/coder-workspaces }  # per-task clones
        - { name: API_PORT,             value: "8096" }
        volumeMounts:
        - { name: sandbox, mountPath: /sandbox }
        - { name: work,    mountPath: /tmp }
        - { name: ollama-key, mountPath: /var/run/secrets/ollama, readOnly: true }
        livenessProbe:
          httpGet: { path: /livez, port: 8096 }
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: sandbox
        persistentVolumeClaim:
          claimName: coder-sandbox
      - name: work
        emptyDir: {}
      # The ollama key as a file (mode 0400), projected under a single key so the
      # mount holds nothing else. Read once at startup by config.from_env via
      # OLLAMA_API_KEY_PATH; deliberately NOT injected as an env var.
      - name: ollama-key
        secret:
          secretName: nano-agent-secrets
          defaultMode: 0400
          items:
          - { key: OLLAMA_API_KEY, path: api-key }
---
apiVersion: v1
kind: Service
metadata:
  name: coder
  namespace: nano-bank
spec:
  selector: { app: coder }
  ports: [ { port: 8096, targetPort: 8096 } ]
