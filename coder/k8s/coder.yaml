# Coder service — LOCAL sandbox mode (no GitHub), sandbox HOSTED ON THE HOST.
# The sandbox bare repo lives on the host at ~/dev/cto-sandbox.git and is served
# to this in-cluster pod by `git daemon` (see coder/start-sandbox-daemon.sh). The
# coder clones git://<host>:9418/cto-sandbox.git and, on green tests, pushes a
# review branch back over receive-pack. You review/merge with PLAIN GIT on the host:
#   git -C ~/dev/cto-sandbox.git log --oneline --all
#   git -C ~/dev/cto-sandbox.git diff main..<branch>
#   git -C ~/dev/cto-sandbox.git merge --ff-only <branch>
#
# SANDBOX_CLONE_URL below is a placeholder; coder/k8s/deploy.sh overrides it with
# the kind network gateway (the host address reachable from pods, e.g.
# git://172.18.0.1:9418/cto-sandbox.git) at deploy time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder
  namespace: nano-bank
  labels: { app: coder }
spec:
  replicas: 1
  selector: { matchLabels: { app: coder } }
  template:
    metadata: { labels: { app: coder } }
    spec:
      containers:
      - name: coder
        image: nano-coder:dev
        imagePullPolicy: Never
        ports: [ { containerPort: 8096 } ]
        envFrom:
        - secretRef: { name: nano-agent-secrets }   # provides OLLAMA_API_KEY (reused from the CTO)
        env:
        - { name: OLLAMA_BASE_URL,      value: https://ollama.com/v1 }
        - { name: CODER_MODEL,          value: kimi-k2.6 }
        - { name: CODER_MODEL_FALLBACK, value: kimi-k2.6 }
        - { name: SANDBOX_MODE,         value: local }
        - { name: SANDBOX_REPO,         value: cto-sandbox }
        - { name: SANDBOX_CLONE_URL,    value: "git://SANDBOX_HOST:9418/cto-sandbox.git" }  # deploy.sh overrides SANDBOX_HOST
        - { name: CODER_WORKSPACE_ROOT, value: /tmp/coder-workspaces }
        - { name: API_PORT,             value: "8096" }
        livenessProbe:
          httpGet: { path: /livez, port: 8096 }
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: coder
  namespace: nano-bank
spec:
  selector: { app: coder }
  ports: [ { port: 8096, targetPort: 8096 } ]
